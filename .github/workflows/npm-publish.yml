name: Publish npm

# This reusable workflow is called by release.yml. Configure the npm Trusted
# Publisher workflow filename as release.yml, not npm-publish.yml.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Do not set registry-url here. setup-node writes an empty
          # _authToken=${NODE_AUTH_TOKEN} entry, which prevents npm from
          # exchanging the GitHub OIDC token when no npm token is configured.
          package-manager-cache: false
      - name: Update npm to latest
        run: npm install -g npm@latest
      - name: Validate npm version against release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package.json version $PACKAGE_VERSION does not match" \
              "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          WILLH_NOW_RELEASE_ASSET_RETRIES: 12
          WILLH_NOW_RELEASE_ASSET_RETRY_DELAY_MS: 10000
